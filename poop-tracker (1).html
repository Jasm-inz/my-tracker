<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="J&J Tracker">
<meta name="theme-color" content="#0f0f0f">
<title>J&J Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=Syne+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f0f;
  --surface: #181818;
  --surface2: #222222;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text: #f2efe9;
  --text2: rgba(242,239,233,0.45);
  --text3: rgba(242,239,233,0.22);
  --jamir: #7eb8f7;
  --jamir-dim: rgba(126,184,247,0.1);
  --jas: #b89ef7;
  --jas-dim: rgba(184,158,247,0.1);
  --blue: #a0c8f5;
  --font: 'Syne', sans-serif;
  --mono: 'Syne Mono', monospace;
  --r: 16px;
  --r-sm: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100dvh; overscroll-behavior: none; }
.app { max-width: 420px; margin: 0 auto; padding: env(safe-area-inset-top,0) 0 calc(env(safe-area-inset-bottom,0) + 20px); }

/* Splash */
#splash {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; z-index: 100;
  transition: opacity 0.5s ease;
}
#splash.fade { opacity: 0; pointer-events: none; }
.splash-icon {
  width: 100px; height: 100px; border-radius: 24px; background: #12101f;
  display: flex; align-items: center; justify-content: center;
  animation: pop 0.5s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes pop { from{transform:scale(0.5);opacity:0} to{transform:scale(1);opacity:1} }
.splash-title { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: 0.02em; }
.splash-sub { font-size: 12px; color: var(--text3); }

.topbar { display: flex; justify-content: space-between; align-items: center; padding: 24px 20px 0; margin-bottom: 28px; }
.app-icon-sm { width: 32px; height: 32px; border-radius: 8px; background: #12101f; display: flex; align-items: center; justify-content: center; }
.sync-status { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text3); }
.sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text3); }
.sync-dot.synced { background: #5dcaa5; }
.sync-dot.syncing { background: #f5dfa0; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

.week-nav { display: flex; align-items: center; justify-content: space-between; padding: 0 20px; margin-bottom: 24px; }
.mnav-btn { width: 36px; height: 36px; border-radius: 50%; border: 0.5px solid var(--border2); background: var(--surface); color: var(--text2); cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; }
.mnav-btn:active { background: var(--surface2); }
.month-label { font-size: 26px; font-weight: 700; color: var(--text); min-width: 160px; text-align: center; }

.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 20px; margin-bottom: 20px; }
.stat { background: var(--surface); border-radius: var(--r-sm); padding: 10px 8px; text-align: center; }
.stat-val { font-size: 16px; font-weight: 500; color: var(--text); font-family: var(--mono); }
.stat-lbl { font-size: 10px; color: var(--text3); margin-top: 3px; line-height: 1.3; }

.section-hd { font-size: 11px; font-weight: 600; color: var(--text3); letter-spacing: 0.1em; text-transform: uppercase; padding: 0 20px; margin-bottom: 10px; }

.tap-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 20px; margin-bottom: 10px; }
.tap-btn { border-radius: var(--r); border: 0.5px solid var(--border2); padding: 20px 16px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; transition: transform 0.1s; position: relative; overflow: hidden; width: 100%; }
.tap-btn:active { transform: scale(0.97); }
.tap-btn.jamir { background: var(--jamir-dim); border-color: rgba(126,184,247,0.2); }
.tap-btn.jas { background: var(--jas-dim); border-color: rgba(184,158,247,0.2); }
.tap-btn-name { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; }
.tap-btn.jamir .tap-btn-name { color: var(--jamir); }
.tap-btn.jas .tap-btn-name { color: var(--jas); }
.tap-btn-today { font-size: 36px; font-weight: 700; font-family: var(--mono); }
.tap-btn.jamir .tap-btn-today { color: var(--jamir); }
.tap-btn.jas .tap-btn-today { color: var(--jas); }
.tap-btn-sub { font-size: 10px; color: var(--text3); }
.ripple { position: absolute; border-radius: 50%; width: 80px; height: 80px; margin-top: -40px; margin-left: -40px; animation: ripple 0.4s ease-out forwards; pointer-events: none; }
.tap-btn.jamir .ripple { background: rgba(126,184,247,0.25); }
.tap-btn.jas .ripple { background: rgba(184,158,247,0.25); }
@keyframes ripple { from{transform:scale(0);opacity:1} to{transform:scale(4);opacity:0} }

.undo-row { display: flex; gap: 8px; padding: 0 20px; margin-bottom: 24px; }
.undo-btn { flex: 1; padding: 8px; border-radius: var(--r-sm); border: 0.5px solid var(--border); background: transparent; font-size: 12px; font-family: var(--font); cursor: pointer; color: var(--text3); }
.undo-btn:active { background: var(--surface2); }

.stats-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 20px; margin-bottom: 28px; }
.stat-card { border-radius: var(--r); padding: 14px 16px; border: 0.5px solid var(--border); }
.stat-card.jamir { background: var(--jamir-dim); border-color: rgba(126,184,247,0.15); }
.stat-card.jas { background: var(--jas-dim); border-color: rgba(184,158,247,0.15); }
.sc-name { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 10px; }
.stat-card.jamir .sc-name { color: var(--jamir); }
.stat-card.jas .sc-name { color: var(--jas); }
.sc-total { font-size: 36px; font-weight: 700; font-family: var(--mono); margin-bottom: 2px; }
.stat-card.jamir .sc-total { color: var(--jamir); }
.stat-card.jas .sc-total { color: var(--jas); }
.sc-per { font-size: 13px; color: var(--text2); font-family: var(--mono); }
.sc-trend { font-size: 11px; color: var(--text3); margin-top: 6px; }

.year-section { padding: 0 20px; margin-bottom: 24px; }
.year-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.year-select { background: var(--surface); border: 0.5px solid var(--border2); border-radius: var(--r-sm); padding: 4px 8px; color: var(--text2); font-size: 12px; font-family: var(--font); cursor: pointer; }
.year-table { width: 100%; border-collapse: collapse; }
.year-table th { font-size: 10px; color: var(--text3); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 0 0 8px; text-align: left; }
.year-table th:not(:first-child) { text-align: right; }
.year-table td { font-size: 13px; padding: 7px 0; border-top: 0.5px solid var(--border); font-family: var(--mono); }
.year-table td:first-child { color: var(--text2); font-family: var(--font); font-size: 13px; font-weight: 500; }
.year-table td.jc { color: var(--jamir); text-align: right; }
.year-table td.jasc { color: var(--jas); text-align: right; }
.year-table td.muted { color: var(--text3); text-align: right; }
.year-table tr.total-row td { border-top: 0.5px solid var(--border2); font-weight: 600; padding-top: 10px; }

.divider { height: 0.5px; background: var(--border); margin: 0 20px 24px; }
.toast { position: fixed; top: 0; left: 50%; transform: translateX(-50%) translateY(-60px); background: var(--text); color: var(--bg); font-size: 13px; font-weight: 600; padding: 10px 20px; border-radius: 100px; transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1); z-index: 999; white-space: nowrap; pointer-events: none; font-family: var(--font); }
.toast.show { transform: translateX(-50%) translateY(calc(env(safe-area-inset-top,0) + 14px)); }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
</style>
</head>
<body>

<!-- Splash screen -->
<div id="splash">
  <div class="splash-icon">
    <svg width="70" height="70" viewBox="0 0 90 90">
      <circle cx="45" cy="18" r="7" fill="#7eb8f7"/>
      <circle cx="45" cy="72" r="7" fill="#7eb8f7"/>
      <circle cx="18" cy="45" r="7" fill="#7eb8f7"/>
      <circle cx="72" cy="45" r="7" fill="#7eb8f7"/>
      <circle cx="24" cy="24" r="5.5" fill="#b89ef7" opacity="0.7"/>
      <circle cx="66" cy="24" r="5.5" fill="#b89ef7" opacity="0.7"/>
      <circle cx="24" cy="66" r="5.5" fill="#b89ef7" opacity="0.7"/>
      <circle cx="66" cy="66" r="5.5" fill="#b89ef7" opacity="0.7"/>
      <circle cx="45" cy="45" r="16" fill="#1e1a3a"/>
      <circle cx="45" cy="45" r="16" fill="none" stroke="#b89ef7" stroke-width="1.5" opacity="0.4"/>
      <text x="36" y="51" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#7eb8f7">J</text>
      <text x="46" y="51" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#b89ef7">J</text>
    </svg>
  </div>
  <div class="splash-title">J&J tracker</div>
  <div class="splash-sub">connecting...</div>
</div>

<div id="mainApp" style="display:none;">
<div class="app">
  <div class="topbar">
    <div class="app-icon-sm">
      <svg width="22" height="22" viewBox="0 0 90 90">
        <circle cx="45" cy="18" r="7" fill="#7eb8f7"/>
        <circle cx="45" cy="72" r="7" fill="#7eb8f7"/>
        <circle cx="18" cy="45" r="7" fill="#7eb8f7"/>
        <circle cx="72" cy="45" r="7" fill="#7eb8f7"/>
        <circle cx="24" cy="24" r="5.5" fill="#b89ef7" opacity="0.7"/>
        <circle cx="66" cy="24" r="5.5" fill="#b89ef7" opacity="0.7"/>
        <circle cx="24" cy="66" r="5.5" fill="#b89ef7" opacity="0.7"/>
        <circle cx="66" cy="66" r="5.5" fill="#b89ef7" opacity="0.7"/>
        <circle cx="45" cy="45" r="16" fill="#1e1a3a"/>
        <text x="36" y="51" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#7eb8f7">J</text>
        <text x="46" y="51" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#b89ef7">J</text>
      </svg>
    </div>
    <span class="sync-status"><span class="sync-dot" id="syncDot"></span><span id="syncLabel">connecting</span></span>
  </div>

  <div class="week-nav">
    <button class="mnav-btn" onclick="changeMonth(-1)">‹</button>
    <span class="month-label" id="monthLabel"></span>
    <button class="mnav-btn" onclick="changeMonth(1)">›</button>
  </div>

  <div class="stats-row">
    <div class="stat"><div class="stat-val" id="statJTotal">—</div><div class="stat-lbl">Jamir total</div></div>
    <div class="stat"><div class="stat-val" id="statJPer">—</div><div class="stat-lbl">Jamir /day</div></div>
    <div class="stat"><div class="stat-val" id="statJasTotal">—</div><div class="stat-lbl">Jas total</div></div>
    <div class="stat"><div class="stat-val" id="statJasPer">—</div><div class="stat-lbl">Jas /day</div></div>
  </div>

  <div class="section-hd">Tap to log today</div>
  <div class="tap-buttons">
    <button class="tap-btn jamir" onclick="logOne('jamir',event)">
      <span class="tap-btn-name">Jamir 💙</span>
      <span class="tap-btn-today" id="todayJamir">0</span>
      <span class="tap-btn-sub">today</span>
    </button>
    <button class="tap-btn jas" onclick="logOne('jas',event)">
      <span class="tap-btn-name">Jasmine 💜</span>
      <span class="tap-btn-today" id="todayJas">0</span>
      <span class="tap-btn-sub">today</span>
    </button>
  </div>
  <div class="undo-row">
    <button class="undo-btn" onclick="undoOne('jamir')">↩ Undo Jamir</button>
    <button class="undo-btn" onclick="undoOne('jas')">↩ Undo Jasmine</button>
  </div>

  <div class="divider"></div>
  <div class="section-hd" id="statsMonthLabel">This month</div>
  <div class="stats-cards">
    <div class="stat-card jamir">
      <div class="sc-name">Jamir</div>
      <div class="sc-total" id="totalJamir">—</div>
      <div class="sc-per" id="perJamir">— /day</div>
      <div class="sc-trend" id="trendJamir"></div>
    </div>
    <div class="stat-card jas">
      <div class="sc-name">Jasmine</div>
      <div class="sc-total" id="totalJas">—</div>
      <div class="sc-per" id="perJas">— /day</div>
      <div class="sc-trend" id="trendJas"></div>
    </div>
  </div>

  <div class="divider"></div>
  <div class="year-section">
    <div class="year-header">
      <span class="section-hd" style="padding:0;margin:0;">Year overview</span>
      <select class="year-select" id="yearSelect" onchange="renderYearTable()">
        <option value="2025">2025</option>
        <option value="2026" selected>2026</option>
      </select>
    </div>
    <table class="year-table">
      <thead><tr>
        <th>Month</th>
        <th style="color:var(--jamir)">Jamir</th>
        <th style="color:var(--jamir)">Avg</th>
        <th style="color:var(--jas)">Jas</th>
        <th style="color:var(--jas)">Avg</th>
      </tr></thead>
      <tbody id="yearBody"></tbody>
    </table>
  </div>
</div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, getDoc, setDoc, onSnapshot, increment, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyAQrkWjz7m8EQQWvbjmsRyU8TJpft25G0c",
  authDomain: "poop-tracker-709e3.firebaseapp.com",
  projectId: "poop-tracker-709e3",
  storageBucket: "poop-tracker-709e3.firebasestorage.app",
  messagingSenderId: "757614511809",
  appId: "1:757614511809:web:27689e9ad21b99b3aff640"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS_IN_MONTH = (y,m) => new Date(y,m+1,0).getDate();

const HISTORICAL = {
  '2025': {
    0:{jamir:24,jas:28},1:{jamir:23,jas:18},2:{jamir:26,jas:25},
    3:{jamir:25,jas:23},4:{jamir:28,jas:32},5:{jamir:24,jas:19},
    6:{jamir:29,jas:27},7:{jamir:31,jas:29},8:{jamir:31,jas:27},
    9:{jamir:34,jas:25},10:{jamir:31,jas:14},11:{jamir:27,jas:20}
  },
  '2026': {
    0:{jamir:29,jas:15},1:{jamir:26,jas:17},2:{jamir:24,jas:24},
    3:{jamir:27,jas:28},4:{jamir:6,jas:6}
  }
};

const today = new Date();
let viewYear = today.getFullYear();
let viewMonth = today.getMonth();
let currentData = {};
let unsubscribe = null;

function docId(y,m) { return `${y}_${String(m).padStart(2,'0')}`; }
function todayKey() { return today.toISOString().slice(0,10); }

function setSyncStatus(s) {
  document.getElementById('syncDot').className = 'sync-dot ' + s;
  document.getElementById('syncLabel').textContent = s==='synced'?'synced':s==='syncing'?'syncing...':'offline';
}

async function migrateHistorical() {
  for (const [yr, months] of Object.entries(HISTORICAL)) {
    for (const [m, vals] of Object.entries(months)) {
      const ref = doc(db,'counts',docId(parseInt(yr),parseInt(m)));
      const snap = await getDoc(ref);
      if (!snap.exists()) {
        await setDoc(ref,{jamir:vals.jamir,jas:vals.jas,days:{},year:parseInt(yr),month:parseInt(m)});
      }
    }
  }
}

function subscribeToMonth(year, month) {
  if (unsubscribe) unsubscribe();
  const ref = doc(db,'counts',docId(year,month));
  unsubscribe = onSnapshot(ref, snap => {
    if (snap.exists()) { currentData = snap.data(); }
    else {
      const hist = (HISTORICAL[String(year)]||{})[month];
      currentData = hist ? {jamir:hist.jamir,jas:hist.jas,days:{},year,month} : {jamir:0,jas:0,days:{},year,month};
    }
    setSyncStatus('synced');
    render();
  }, () => setSyncStatus('offline'));
}

async function logOne(person, e) {
  const btn = e.currentTarget;
  const r = document.createElement('span');
  r.className = 'ripple';
  const rect = btn.getBoundingClientRect();
  r.style.left = (e.clientX-rect.left)+'px';
  r.style.top = (e.clientY-rect.top)+'px';
  btn.appendChild(r);
  setTimeout(()=>r.remove(),400);

  const isCurrent = viewYear===today.getFullYear()&&viewMonth===today.getMonth();
  if (!isCurrent) { toast('Switch to current month to log'); return; }

  setSyncStatus('syncing');
  const ref = doc(db,'counts',docId(viewYear,viewMonth));
  const snap = await getDoc(ref);
  if (!snap.exists()) await setDoc(ref,{jamir:0,jas:0,days:{},year:viewYear,month:viewMonth});
  const tk = todayKey();
  await setDoc(ref,{[person]:increment(1),['days.'+tk+'.'+person]:increment(1),updatedAt:serverTimestamp()},{merge:true});
  toast(person==='jamir'?'💙 Logged for Jamir!':'💜 Logged for Jasmine!');
}

async function undoOne(person) {
  const isCurrent = viewYear===today.getFullYear()&&viewMonth===today.getMonth();
  if (!isCurrent) return;
  const tk = todayKey();
  const val = ((currentData.days||{})[tk]||{})[person]||0;
  if (val<=0){toast('Nothing to undo');return;}
  setSyncStatus('syncing');
  const ref = doc(db,'counts',docId(viewYear,viewMonth));
  await setDoc(ref,{[person]:increment(-1),['days.'+tk+'.'+person]:increment(-1),updatedAt:serverTimestamp()},{merge:true});
  toast('Undone');
}

function changeMonth(dir) {
  viewMonth+=dir;
  if(viewMonth>11){viewMonth=0;viewYear++;}
  if(viewMonth<0){viewMonth=11;viewYear--;}
  subscribeToMonth(viewYear,viewMonth);
}

function daysElapsed(y,m) {
  if(y===today.getFullYear()&&m===today.getMonth()) return today.getDate();
  return DAYS_IN_MONTH(y,m);
}

function render() {
  const isCurrent = viewYear===today.getFullYear()&&viewMonth===today.getMonth();
  document.getElementById('monthLabel').textContent = `${MONTHS[viewMonth].slice(0,3)} ${viewYear}`;
  document.getElementById('statsMonthLabel').textContent = `${MONTHS[viewMonth]} stats`;
  const tk = todayKey();
  const td = (currentData.days||{})[tk]||{};
  document.getElementById('todayJamir').textContent = isCurrent?(td.jamir||0):'—';
  document.getElementById('todayJas').textContent = isCurrent?(td.jas||0):'—';
  const e = daysElapsed(viewYear,viewMonth);
  const jT = currentData.jamir||0, jasT = currentData.jas||0;
  document.getElementById('statJTotal').textContent = jT||'—';
  document.getElementById('statJPer').textContent = jT&&e?(jT/e).toFixed(2):'—';
  document.getElementById('statJasTotal').textContent = jasT||'—';
  document.getElementById('statJasPer').textContent = jasT&&e?(jasT/e).toFixed(2):'—';
  document.getElementById('totalJamir').textContent = jT||'—';
  document.getElementById('perJamir').textContent = e&&jT?(jT/e).toFixed(2)+' /day':'— /day';
  document.getElementById('totalJas').textContent = jasT||'—';
  document.getElementById('perJas').textContent = e&&jasT?(jasT/e).toFixed(2)+' /day':'— /day';

  const prevM = viewMonth===0?11:viewMonth-1;
  const prevY = viewMonth===0?viewYear-1:viewYear;
  getDoc(doc(db,'counts',docId(prevY,prevM))).then(snap => {
    if(snap.exists()){
      const dj = jT-(snap.data().jamir||0);
      const djas = jasT-(snap.data().jas||0);
      document.getElementById('trendJamir').textContent = `vs last month: ${dj>0?'+':''}${dj}`;
      document.getElementById('trendJas').textContent = `vs last month: ${djas>0?'+':''}${djas}`;
    }
  });
  renderYearTable();
}

async function renderYearTable() {
  const yr = parseInt(document.getElementById('yearSelect').value);
  const body = document.getElementById('yearBody');
  body.innerHTML = '';
  let jYT=0,jasYT=0,jYD=0,jasYD=0;
  for(let m=0;m<12;m++){
    const hist=(HISTORICAL[String(yr)]||{})[m];
    const snap = await getDoc(doc(db,'counts',docId(yr,m)));
    let jT=0,jasT=0;
    if(snap.exists()){jT=snap.data().jamir||0;jasT=snap.data().jas||0;}
    else if(hist){jT=hist.jamir;jasT=hist.jas;}
    else continue;
    const days = yr===today.getFullYear()&&m===today.getMonth()?today.getDate():DAYS_IN_MONTH(yr,m);
    jYT+=jT;jasYT+=jasT;jYD+=days;jasYD+=days;
    const isView = yr===viewYear&&m===viewMonth;
    const tr = document.createElement('tr');
    tr.innerHTML=`<td style="${isView?'color:var(--text);font-weight:600':''}">${MONTHS[m].slice(0,3)}</td><td class="jc">${jT||'—'}</td><td class="muted">${jT&&days?(jT/days).toFixed(2):'—'}</td><td class="jasc">${jasT||'—'}</td><td class="muted">${jasT&&days?(jasT/days).toFixed(2):'—'}</td>`;
    body.appendChild(tr);
  }
  if(jYT||jasYT){
    const tr=document.createElement('tr');tr.className='total-row';
    tr.innerHTML=`<td>Total</td><td class="jc">${jYT}</td><td class="muted">${jYD?(jYT/jYD).toFixed(2):'—'}</td><td class="jasc">${jasYT}</td><td class="muted">${jasYD?(jasYT/jasYD).toFixed(2):'—'}</td>`;
    body.appendChild(tr);
  }
}

function toast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

window.logOne=logOne;window.undoOne=undoOne;window.changeMonth=changeMonth;window.renderYearTable=renderYearTable;

async function init() {
  try {
    await migrateHistorical();
    subscribeToMonth(viewYear,viewMonth);
    setTimeout(()=>{
      document.getElementById('splash').classList.add('fade');
      setTimeout(()=>{
        document.getElementById('splash').style.display='none';
        document.getElementById('mainApp').style.display='block';
      },500);
    },1500);
  } catch(err) {
    document.querySelector('.splash-sub').textContent='Connection failed. Check internet.';
  }
}

init();
</script>
</body>
